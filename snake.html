<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101820">
  <title>Snake — Arcade Clássico</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101820;
      --panel: #182630;
      --panel-2: #20333d;
      --line: #304751;
      --text: #f1f7f5;
      --muted: #9db2b4;
      --green: #a8f06a;
      --green-dark: #5fbd58;
      --pink: #ff6b83;
      --gold: #ffd166;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 28px 16px;
      display: grid; place-items: center;
      background: radial-gradient(ellipse at 50% 0%, #243a40 0, var(--bg) 58%);
      color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    button { font: inherit; }
    .app { width: min(100%, 620px); }
    header { text-align: center; margin-bottom: 22px; }
    .eyebrow { color: var(--green); font-size: .72rem; font-weight: 800; letter-spacing: .24em; text-transform: uppercase; }
    h1 { margin: 7px 0 5px; font-size: clamp(2.2rem, 8vw, 3.5rem); line-height: 1; letter-spacing: -.06em; }
    h1 span { color: var(--green); }
    .subtitle { color: var(--muted); margin: 10px 0 0; font-size: .94rem; }
    .scorebar { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
    .score-card {
      padding: 13px 17px; border: 1px solid var(--line); border-radius: 15px;
      background: linear-gradient(145deg, #20333d, #17262f);
      display: flex; justify-content: space-between; align-items: center;
    }
    .score-card small { display: block; color: var(--muted); font-size: .7rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .score-card strong { font-size: 1.55rem; font-variant-numeric: tabular-nums; }
    .score-card .best { color: var(--gold); }
    .game-shell {
      position: relative; overflow: hidden; padding: 10px; border-radius: 20px;
      background: linear-gradient(145deg, #304751, #1a2b34);
      border: 1px solid #3b5660; box-shadow: 0 24px 65px #0007, inset 0 1px #ffffff12;
    }
    canvas {
      display: block; width: 100%; height: auto; aspect-ratio: 1;
      background: #0e1b22; border-radius: 12px; touch-action: none;
    }
    .overlay {
      position: absolute; inset: 10px; border-radius: 12px;
      display: grid; place-items: center; padding: 24px; text-align: center;
      background: #0b171de8; backdrop-filter: blur(5px);
      transition: opacity .2s ease, visibility .2s ease;
    }
    .overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .overlay-content { max-width: 310px; }
    .overlay .symbol { font-size: 2.6rem; margin-bottom: 9px; }
    .overlay h2 { margin: 0 0 8px; font-size: 1.8rem; letter-spacing: -.04em; }
    .overlay p { color: var(--muted); line-height: 1.5; margin: 0 0 19px; font-size: .9rem; }
    .controls-row { display: flex; gap: 10px; margin-top: 14px; }
    .btn {
      min-height: 48px; border: 1px solid transparent; border-radius: 12px;
      padding: 0 18px; font-weight: 800; cursor: pointer;
      transition: transform .15s, filter .15s, background .15s;
    }
    .btn:active { transform: translateY(1px) scale(.98); }
    .btn:focus-visible, .pad button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
    .btn-primary { flex: 1; color: #142018; background: var(--green); box-shadow: 0 5px 18px #a8f06a30; }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-secondary { color: var(--text); background: var(--panel-2); border-color: var(--line); }
    .btn-secondary:hover { background: #29434d; }
    .help {
      display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px;
      margin: 15px 2px 0; color: var(--muted); font-size: .78rem;
    }
    kbd {
      display: inline-block; min-width: 22px; padding: 3px 6px; margin: 0 1px;
      border: 1px solid #48616a; border-bottom-width: 2px; border-radius: 5px;
      color: var(--text); background: #20333d; text-align: center; font: 700 .7rem ui-monospace, monospace;
    }
    .mobile-controls { display: none; margin: 18px auto 0; width: 174px; }
    .pad { display: grid; grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(2, 48px); gap: 5px; justify-content: center; }
    .pad button {
      border: 1px solid var(--line); border-radius: 11px; background: var(--panel-2);
      color: var(--text); font-size: 1.25rem; cursor: pointer; touch-action: manipulation;
    }
    .pad button:active { background: #36545c; }
    .pad .up { grid-column: 2; }
    .pad .left { grid-column: 1; grid-row: 2; }
    .pad .down { grid-column: 2; grid-row: 2; }
    .pad .right { grid-column: 3; grid-row: 2; }
    .status { min-height: 20px; margin-top: 11px; text-align: center; color: var(--muted); font-size: .76rem; }
    @media (pointer: coarse), (max-width: 600px) {
      body { padding: 20px 12px; }
      .mobile-controls { display: block; }
      .help { justify-content: center; text-align: center; }
    }
    @media (max-width: 380px) {
      .score-card { padding: 11px 12px; }
      .controls-row { gap: 7px; }
      .btn { padding: 0 12px; }
      .game-shell { padding: 7px; }
      .overlay { inset: 7px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="eyebrow">✦ clássico arcade ✦</div>
      <h1>SNAKE<span>.</span></h1>
      <p class="subtitle">Colete, cresça e não bata em nada.</p>
    </header>

    <section class="scorebar" aria-label="Placar">
      <div class="score-card"><div><small>Pontuação</small><strong id="score">0</strong></div><span aria-hidden="true">◈</span></div>
      <div class="score-card"><div><small>Recorde</small><strong class="best" id="best">0</strong></div><span aria-hidden="true">★</span></div>
    </section>

    <section class="game-shell" aria-label="Área do jogo">
      <canvas id="game" width="480" height="480" role="img" aria-label="Jogo Snake em uma grade. Use as setas ou WASD para controlar a cobra."></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-content">
          <div class="symbol" id="overlaySymbol">🐍</div>
          <h2 id="overlayTitle">Pronto para jogar?</h2>
          <p id="overlayText">Use as setas ou WASD para guiar a cobrinha até a comida. Cada alimento vale 10 pontos.</p>
          <button class="btn btn-primary" id="overlayButton">Começar partida</button>
        </div>
      </div>
    </section>

    <div class="controls-row">
      <button class="btn btn-primary" id="startBtn">▶ Iniciar</button>
      <button class="btn btn-secondary" id="pauseBtn" disabled>Ⅱ Pausar</button>
      <button class="btn btn-secondary" id="restartBtn">↻ Reiniciar</button>
    </div>

    <div class="mobile-controls" aria-label="Controles direcionais">
      <div class="pad">
        <button class="up" data-dir="up" aria-label="Cima">▲</button>
        <button class="left" data-dir="left" aria-label="Esquerda">◀</button>
        <button class="down" data-dir="down" aria-label="Baixo">▼</button>
        <button class="right" data-dir="right" aria-label="Direita">▶</button>
      </div>
    </div>

    <div class="help">
      <span><kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> ou <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd></span>
      <span><kbd>Espaço</kbd> pausar / continuar</span>
    </div>
    <div class="status" id="status" aria-live="polite">Pressione “Iniciar” para começar.</div>
  </main>

  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const bestEl = document.getElementById("best");
      const overlay = document.getElementById("overlay");
      const overlaySymbol = document.getElementById("overlaySymbol");
      const overlayTitle = document.getElementById("overlayTitle");
      const overlayText = document.getElementById("overlayText");
      const overlayButton = document.getElementById("overlayButton");
      const startBtn = document.getElementById("startBtn");
      const pauseBtn = document.getElementById("pauseBtn");
      const restartBtn = document.getElementById("restartBtn");
      const statusEl = document.getElementById("status");

      const GRID = 24;
      const CELL = canvas.width / GRID;
      const BASE_INTERVAL = 145;
      const MIN_INTERVAL = 72;
      const SPEED_STEP = 5;
      const DIRECTIONS = {
        up: { x: 0, y: -1 }, down: { x: 0, y: 1 },
        left: { x: -1, y: 0 }, right: { x: 1, y: 0 }
      };
      const KEY_DIRECTIONS = {
        ArrowUp: "up", w: "up", W: "up",
        ArrowDown: "down", s: "down", S: "down",
        ArrowLeft: "left", a: "left", A: "left",
        ArrowRight: "right", d: "right", D: "right"
      };

      let snake, food, direction, nextDirection, score, bestScore;
      let state = "ready"; // ready | running | paused | over
      let lastStep = 0;
      let accumulator = 0;
      let animationId = null;

      try { bestScore = Number(localStorage.getItem("snake-best")) || 0; }
      catch (_) { bestScore = 0; }
      bestEl.textContent = bestScore;

      function resetGame() {
        snake = [
          { x: 11, y: 12 }, { x: 10, y: 12 }, { x: 9, y: 12 }
        ];
        direction = "right";
        nextDirection = "right";
        score = 0;
        accumulator = 0;
        scoreEl.textContent = score;
        food = createFood();
        draw();
      }

      function createFood() {
        const freeCells = [];
        for (let y = 0; y < GRID; y++) {
          for (let x = 0; x < GRID; x++) {
            if (!snake.some(segment => segment.x === x && segment.y === y)) {
              freeCells.push({ x, y });
            }
          }
        }
        if (freeCells.length === 0) return null;
        return freeCells[Math.floor(Math.random() * freeCells.length)];
      }

      function setDirection(name) {
        if (!DIRECTIONS[name] || state === "over") return;
        const candidate = DIRECTIONS[name];
        const current = DIRECTIONS[direction];
        if (candidate.x === -current.x && candidate.y === -current.y) return;
        nextDirection = name;
        if (state === "ready") startGame();
      }

      function startGame() {
        if (state === "running") return;
        if (state === "over") resetGame();
        state = "running";
        hideOverlay();
        startBtn.textContent = "▶ Em jogo";
        pauseBtn.disabled = false;
        pauseBtn.textContent = "Ⅱ Pausar";
        statusEl.textContent = "Boa sorte! Continue coletando.";
        lastStep = 0;
        accumulator = 0;
        if (animationId === null) animationId = requestAnimationFrame(gameLoop);
      }

      function pauseGame() {
        if (state === "running") {
          state = "paused";
          showOverlay("Ⅱ", "Jogo pausado", "Respire um pouco. Sua partida está esperando por você.", "Continuar");
          pauseBtn.textContent = "▶ Continuar";
          startBtn.textContent = "▶ Continuar";
          statusEl.textContent = "Partida pausada.";
        } else if (state === "paused") {
          state = "running";
          hideOverlay();
          pauseBtn.textContent = "Ⅱ Pausar";
          startBtn.textContent = "▶ Em jogo";
          statusEl.textContent = "Partida retomada.";
          lastStep = 0;
          accumulator = 0;
        }
      }

      function restartGame() {
        resetGame();
        state = "ready";
        pauseBtn.disabled = true;
        pauseBtn.textContent = "Ⅱ Pausar";
        startBtn.textContent = "▶ Iniciar";
        showOverlay("🐍", "Nova partida", "A cobra está pronta. Quantos pontos você consegue fazer?", "Começar partida");
        statusEl.textContent = "Partida reiniciada.";
      }

      function endGame() {
        state = "over";
        pauseBtn.disabled = true;
        pauseBtn.textContent = "Ⅱ Pausar";
        startBtn.textContent = "↻ Jogar novamente";
        showOverlay("✦", "Fim de jogo!", `Você fez ${score} pontos. ${score > 0 ? "Muito bem — tente superar sua marca!" : "Não desista, tente novamente!"}`, "Jogar novamente");
        statusEl.textContent = "Fim de jogo. Pressione jogar novamente para tentar outra vez.";
      }

      function showOverlay(symbol, title, message, buttonText) {
        overlaySymbol.textContent = symbol;
        overlayTitle.textContent = title;
        overlayText.textContent = message;
        overlayButton.textContent = buttonText;
        overlay.classList.remove("hidden");
      }

      function hideOverlay() { overlay.classList.add("hidden"); }

      function gameLoop(timestamp) {
        if (state !== "running") {
          animationId = null;
          return;
        }
        if (!lastStep) lastStep = timestamp;
        const delta = Math.min(timestamp - lastStep, 250);
        lastStep = timestamp;
        accumulator += delta;

        const interval = Math.max(MIN_INTERVAL, BASE_INTERVAL - Math.floor(score / 30) * SPEED_STEP);
        while (accumulator >= interval && state === "running") {
          update();
          accumulator -= interval;
        }
        draw();
        if (state === "running") animationId = requestAnimationFrame(gameLoop);
        else animationId = null;
      }

      function update() {
        direction = nextDirection;
        const vector = DIRECTIONS[direction];
        const head = { x: snake[0].x + vector.x, y: snake[0].y + vector.y };

        if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
          endGame(); return;
        }

        const eating = food && head.x === food.x && head.y === food.y;
        // A cauda pode sair da posição atual neste passo se não houver comida.
        const bodyToCheck = eating ? snake : snake.slice(0, -1);
        if (bodyToCheck.some(segment => segment.x === head.x && segment.y === head.y)) {
          endGame(); return;
        }

        snake.unshift(head);
        if (eating) {
          score += 10;
          scoreEl.textContent = score;
          if (score > bestScore) {
            bestScore = score;
            bestEl.textContent = bestScore;
            try { localStorage.setItem("snake-best", String(bestScore)); } catch (_) { /* armazenamento indisponível */ }
          }
          food = createFood();
          if (!food) { endGame(); return; }
          statusEl.textContent = `+10 pontos! Velocidade: nível ${Math.floor(score / 30) + 1}.`;
        } else {
          snake.pop();
        }
      }

      function roundedRect(x, y, width, height, radius) {
        ctx.beginPath();
        ctx.roundRect(x, y, width, height, radius);
        ctx.fill();
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#0e1b22";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Grade discreta para reforçar a leitura espacial.
        ctx.strokeStyle = "rgba(132, 170, 164, 0.075)";
        ctx.lineWidth = 1;
        for (let i = 1; i < GRID; i++) {
          const position = i * CELL;
          ctx.beginPath(); ctx.moveTo(position, 0); ctx.lineTo(position, canvas.height); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, position); ctx.lineTo(canvas.width, position); ctx.stroke();
        }

        if (food) {
          const cx = food.x * CELL + CELL / 2;
          const cy = food.y * CELL + CELL / 2;
          ctx.shadowColor = "#ff6b83";
          ctx.shadowBlur = 13;
          ctx.fillStyle = "#ff6b83";
          ctx.beginPath(); ctx.arc(cx, cy, CELL * .32, 0, Math.PI * 2); ctx.fill();
          ctx.shadowBlur = 0;
          ctx.fillStyle = "#ffd0d8";
          ctx.beginPath(); ctx.arc(cx - 3, cy - 3, CELL * .09, 0, Math.PI * 2); ctx.fill();
        }

        snake.forEach((segment, index) => {
          const inset = index === 0 ? 1.5 : 2;
          const x = segment.x * CELL + inset;
          const y = segment.y * CELL + inset;
          const size = CELL - inset * 2;
          ctx.fillStyle = index === 0 ? "#c5ff83" : `hsl(${105 - Math.min(index * 1.1, 28)}, 67%, ${58 - Math.min(index * .22, 10)}%)`;
          ctx.shadowColor = index === 0 ? "#a8f06a" : "transparent";
          ctx.shadowBlur = index === 0 ? 10 : 0;
          roundedRect(x, y, size, size, index === 0 ? 6 : 4);
        });
        ctx.shadowBlur = 0;

        // Olhos da cabeça acompanham a direção atual.
        if (snake.length) {
          const head = snake[0];
          const cx = head.x * CELL + CELL / 2;
          const cy = head.y * CELL + CELL / 2;
          const eyeOffset = direction === "left" || direction === "right" ? { x: 0, y: 4 } : { x: 4, y: 0 };
          const forward = DIRECTIONS[direction];
          const side = { x: -forward.y, y: forward.x };
          ctx.fillStyle = "#163022";
          for (const sign of [-1, 1]) {
            const ex = cx + forward.x * 4 + side.x * eyeOffset.x * sign + side.x * 3 * sign;
            const ey = cy + forward.y * 4 + side.y * eyeOffset.y * sign + side.y * 3 * sign;
            ctx.beginPath(); ctx.arc(ex, ey, 1.7, 0, Math.PI * 2); ctx.fill();
          }
        }
      }

      document.addEventListener("keydown", event => {
        if (KEY_DIRECTIONS[event.key]) {
          event.preventDefault();
          setDirection(KEY_DIRECTIONS[event.key]);
        } else if (event.code === "Space") {
          event.preventDefault();
          if (state === "ready" || state === "over") startGame();
          else pauseGame();
        } else if (event.key === "Escape" && state === "running") {
          pauseGame();
        }
      });

      document.querySelectorAll("[data-dir]").forEach(button => {
        const handle = event => {
          event.preventDefault();
          setDirection(button.dataset.dir);
        };
        button.addEventListener("pointerdown", handle);
        button.addEventListener("click", handle);
      });

      startBtn.addEventListener("click", () => {
        if (state === "paused") pauseGame();
        else startGame();
      });
      pauseBtn.addEventListener("click", pauseGame);
      restartBtn.addEventListener("click", restartGame);
      overlayButton.addEventListener("click", () => {
        if (state === "paused") pauseGame();
        else startGame();
      });

      // Swipe na área do tabuleiro para dispositivos móveis.
      let touchStart = null;
      canvas.addEventListener("pointerdown", event => {
        touchStart = { x: event.clientX, y: event.clientY };
      });
      canvas.addEventListener("pointerup", event => {
        if (!touchStart) return;
        const dx = event.clientX - touchStart.x;
        const dy = event.clientY - touchStart.y;
        touchStart = null;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) return;
        setDirection(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
      });

      resetGame();
      showOverlay("🐍", "Pronto para jogar?", "Use as setas ou WASD para guiar a cobrinha até a comida. Cada alimento vale 10 pontos.", "Começar partida");
    })();
  </script>
</body>
</html>
